spring:
  datasource:
    url: jdbc:h2:file:./backend/data/tournamagic;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

auth:
  session:
    ttl-hours: ${AUTH_SESSION_TTL_HOURS:168}
  google:
    audience:
      - ${AUTH_GOOGLE_CLIENT_ID:google-client-id.apps.googleusercontent.com}
  apple:
    audience:
      - ${AUTH_APPLE_CLIENT_ID:com.example.tournamagic}

server:
  port: 8080
