services:
  supabase-db:
    image: supabase/postgres:15.8.1.060
    container_name: tournamagic-supabase-db
    environment:
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./docker/supabase/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  supabase-auth:
    image: supabase/gotrue:v2.170.0
    container_name: tournamagic-supabase-auth
    depends_on:
      - supabase-db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${SUPABASE_DB_PASSWORD:-postgres}@supabase-db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:5174
      GOTRUE_URI_ALLOW_LIST: http://localhost:5174
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  supabase-rest:
    image: postgrest/postgrest:v12.2.8
    container_name: tournamagic-supabase-rest
    depends_on:
      - supabase-db
    environment:
      PGRST_DB_URI: postgres://postgres:${SUPABASE_DB_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000

  backend:
    build:
      context: ./backend
    container_name: tournamagic-backend
    ports:
      - "8080:8080"
    environment:
      SUPABASE_REST_URL: http://supabase-rest:3000
      SUPABASE_AUTH_URL: http://supabase-auth:9999
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzczNjc0Mzc3LCJleHAiOjE4OTM0NTYwMDB9.xRVpTmafXhrwCWIxIETreQV77niiKFhjbPs8OtEqrgQ}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3NzM2NzQzNzcsImV4cCI6MTg5MzQ1NjAwMH0.qKzwz5I6lAUDbmsxuDjDeGx9kJR2Ka7QyRjkpd6L6e0}
    depends_on:
      - supabase-auth
      - supabase-rest

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tournamagic-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  supabase_db_data:
